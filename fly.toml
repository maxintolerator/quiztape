# fly.toml app configuration file generated for quiztape-api on 2026-09-19T15:40:11-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quiztape-api'
primary_region = 'iad'

[build]
  dockerfile = 'apps/api/Dockerfile'

[deploy]
  release_command = 'npm run db:migrate'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  WORKER_ENABLED = 'true'
  WORKER_ID = 'fly-1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
