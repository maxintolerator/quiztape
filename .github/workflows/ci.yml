name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Bundles web, iOS and Android through Metro. This is the guard against
      # web-only code, and it also generates the typed-route declarations tsc needs.
      - run: npm run check:platforms
      - run: npm run typecheck
      - run: npm test
      - run: npm run doctor
